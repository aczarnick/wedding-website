name: Terraform env (reusable)

# Runs plan + apply for a single environment in one job. Plan and apply happen
# atomically on the same commit, so the applied plan always equals the plan just
# generated (no plan/apply drift). When environment_name is set, the GitHub
# Environment's approval gate blocks the whole job until a reviewer approves.
on:
  workflow_call:
    inputs:
      env_dir:
        description: Directory under infra/terraform/environments
        required: true
        type: string
      environment_name:
        description: GitHub Environment gating apply (empty = no gate)
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: ${{ inputs.env_dir }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    concurrency:
      group: infra-${{ inputs.env_dir }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ inputs.env_dir }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_INFRA_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Complex-typed TF vars must be valid HCL/JSON, e.g. ALERT_EMAILS_JSON = ["a@b.com"].
      TF_VAR_tfstate_storage_account_name: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      TF_VAR_acr_name: ${{ vars.ACR_NAME }}
      # A secret (not a var) so GitHub masks the email in logs, incl. error paths.
      TF_VAR_alert_emails: ${{ secrets.ALERT_EMAILS_JSON }}
      TF_VAR_budget_start_date: ${{ vars.BUDGET_START_DATE }}
      # Origin lock lives in a repo variable, not a gitignored tfvars, so the
      # pipeline never reverts it. Defaults to [] (open) until you set it.
      TF_VAR_allowed_ip_ranges: ${{ vars.ALLOWED_IP_RANGES_JSON || '[]' }}
      # SQL server AAD admin (the czw-sql-admins Entra group). Set by object ID so
      # the RG-Contributor infra identity needs no directory permission.
      TF_VAR_sql_admin_group_object_id: ${{ vars.SQL_AAD_ADMIN_GROUP_OBJECT_ID }}
      TF_VAR_sql_admin_group_name: ${{ vars.SQL_AAD_ADMIN_GROUP_NAME }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      # Admin console sign-in. ADMIN_PASSWORD_HASH is the scrypt hash from
      # `npm run auth:hash`, never the password. Both are secrets so GitHub
      # masks them in logs; until they are set, the console denies everyone.
      TF_VAR_admin_email: ${{ secrets.ADMIN_EMAIL || '' }}
      TF_VAR_admin_password_hash: ${{ secrets.ADMIN_PASSWORD_HASH || '' }}
      # Cloudflare provider auth — a single zone-scoped API token; required
      # scopes documented in docs/deployment/README.md (Custom domains).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Init
        run: terraform init -input=false -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
      - name: Plan
        run: terraform plan -input=false -lock-timeout=180s -out=tfplan
      - name: Apply
        run: terraform apply -input=false -lock-timeout=180s tfplan
