name: Deploy env (reusable)

# Deploys one image to one Container App, then blocks until the new revision is
# provisioned and the site serves the expected content. Rollback = re-run the
# Deploy workflow (workflow_dispatch) with a previous image ref.
on:
  workflow_call:
    inputs:
      resource_group:
        required: true
        type: string
      app_name:
        required: true
        type: string
      image:
        required: true
        type: string
      environment_name:
        description: GitHub Environment gating this deploy (empty = no gate)
        required: false
        type: string
        default: ""
      smoke_host:
        description: Public hostname to smoke test through Cloudflare (e.g. czarnickwedding.com). Empty = hit the default ACA FQDN directly (pre-DNS / pre-origin-lock bring-up).
        required: false
        type: string
        default: ""
    secrets:
      sql_admin_password:
        description: SQL-auth server admin password, used only to run migrations. Required when ENABLE_DB_MIGRATIONS is true.
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: ${{ inputs.app_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    concurrency:
      group: deploy-${{ inputs.app_name }}
      cancel-in-progress: false
    env:
      SMOKE_STRING: "October 10, 2026"
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Assert app exists
        run: |
          az containerapp show -g "${{ inputs.resource_group }}" -n "${{ inputs.app_name }}" -o none \
            || { echo "::error::Container App ${{ inputs.app_name }} not found — run the Infra workflow first."; exit 1; }

      # Migrations are gated on the ENABLE_DB_MIGRATIONS repo variable, not merged
      # "on". Turn it to 'true' once (a) the SQL servers exist (first Infra apply),
      # (b) the deploy SP is in czw-sql-admins, and (c) it has SQL firewall-rule
      # write — see docs/deployment/README.md. Off = deploy is pure az CLI, unchanged.
      - uses: actions/checkout@v7
        if: ${{ vars.ENABLE_DB_MIGRATIONS == 'true' }}
      - uses: actions/setup-node@v4
        if: ${{ vars.ENABLE_DB_MIGRATIONS == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        if: ${{ vars.ENABLE_DB_MIGRATIONS == 'true' }}
        run: npm ci

      # Runs migrations against this env's DB before the new image goes live, so
      # schema never lags the code.
      #
      # Two different auth paths on purpose. Granting the app identity uses Node's
      # mssql driver, which resolves the runner's `az login` session — passwordless.
      # Migrations cannot: `prisma migrate deploy` runs a Rust engine whose SQL
      # Server driver has no `authentication`/`accesstoken` parameter, so it can
      # only present a username and password. Hence the SQL admin credential.
      - name: Run database migrations
        if: ${{ vars.ENABLE_DB_MIGRATIONS == 'true' }}
        env:
          NODE_ENV: production
          SQL_DATABASE: rsvp
          SQL_ADMIN_PASSWORD: ${{ secrets.sql_admin_password }}
        run: |
          set -euo pipefail
          if [ -z "$SQL_ADMIN_PASSWORD" ]; then
            echo "::error::SQL_ADMIN_PASSWORD secret is empty — migrations cannot authenticate. See docs/deployment/README.md."
            exit 1
          fi
          ENV_SUFFIX="${{ inputs.resource_group }}"; ENV_SUFFIX="${ENV_SUFFIX#rg-czw-}"
          SERVER="sql-czw-${ENV_SUFFIX}"
          RG="${{ inputs.resource_group }}"
          export SQL_SERVER="${SERVER}.database.windows.net"

          # Open the SQL firewall to this runner for the duration of the job.
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          RULE="ci-migrate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az sql server firewall-rule create -g "$RG" -s "$SERVER" -n "$RULE" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" -o none
          trap 'az sql server firewall-rule delete -g "$RG" -s "$SERVER" -n "$RULE" -o none || true' EXIT

          # Idempotently grant the app's managed identity DB access, then migrate.
          node scripts/ensure-db-user.mjs "id-czw-app-${ENV_SUFFIX}"

          # Read the admin login rather than hardcoding it: it is the login Azure
          # generated when the server was created AAD-only, and it differs per
          # environment. Terraform cannot rename it without destroying the server.
          SQL_ADMIN_LOGIN=$(az sql server show -g "$RG" -n "$SERVER" --query administratorLogin -o tsv)
          export DATABASE_URL="sqlserver://${SQL_SERVER}:1433;database=rsvp;user=${SQL_ADMIN_LOGIN};password=${SQL_ADMIN_PASSWORD};encrypt=true"
          npm run --silent db:migrate:deploy

      - name: Deploy image
        run: az containerapp update -g "${{ inputs.resource_group }}" -n "${{ inputs.app_name }}" --image "${{ inputs.image }}" -o none

      - name: Wait for revision + smoke test
        run: |
          set -euo pipefail
          RG="${{ inputs.resource_group }}"
          APP="${{ inputs.app_name }}"

          echo "Waiting for latest revision to be provisioned..."
          PROVISIONED=false
          for i in $(seq 1 40); do
            LATEST=$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)
            STATE=$(az containerapp revision show -g "$RG" -n "$APP" --revision "$LATEST" --query properties.provisioningState -o tsv 2>/dev/null || echo "Pending")
            echo "  $LATEST: $STATE"
            if [ "$STATE" = "Provisioned" ]; then PROVISIONED=true; break; fi
            [ "$STATE" = "Failed" ] && { echo "::error::Revision $LATEST failed to provision"; exit 1; }
            sleep 6
          done
          if [ "$PROVISIONED" != "true" ]; then
            echo "::error::Revision $LATEST never reached Provisioned — aborting before smoke test"
            exit 1
          fi

          # After the origin is IP-locked to Cloudflare, GitHub runners can't reach
          # the default ACA FQDN — smoke through the public host instead. Cloudflare
          # does not cache HTML by default, so this still exercises the origin.
          HOST="${{ inputs.smoke_host }}"
          if [ -n "$HOST" ]; then
            TARGET="https://$HOST/"
          else
            FQDN=$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)
            TARGET="https://$FQDN/"
          fi

          echo "Smoke testing $TARGET (allows for scale-from-zero cold start)..."
          for i in $(seq 1 20); do
            if curl -fsS --max-time 20 "$TARGET" | grep -qF "$SMOKE_STRING"; then
              echo "Smoke test passed."
              exit 0
            fi
            echo "  attempt $i: not ready, retrying"
            sleep 6
          done
          echo "::error::Smoke test failed — '$SMOKE_STRING' not served by $TARGET"
          exit 1
