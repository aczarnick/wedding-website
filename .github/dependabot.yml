version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Hold @types/node at the Node 24 LTS major; drop once Node 26 reaches LTS (Oct 2026).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 breaks lint: typescript-eslint (bundled by eslint-config-next) peers
      # typescript <6.1.0. Drop once eslint-config-next ships a TS 7-compatible typescript-eslint.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint 10 breaks lint: eslint-plugin-react (bundled by eslint-config-next) has no
      # eslint 10-compatible release. Drop once eslint-config-next supports eslint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # next-auth is a pre-GA (beta) dependency; hold at chosen version until GA release.
      - dependency-name: "next-auth"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Hold node at the 24 LTS line; drop once Node 26 reaches LTS (Oct 2026).
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
